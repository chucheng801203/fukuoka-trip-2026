<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 単語帳 ・ 570語 綜合複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEE3;        /* washi 紙 */
    --paper-2:#FBF8F1;      /* 卡片表面 */
    --ink:#22303F;          /* 藍墨 主文字 */
    --ink-soft:#68717E;     /* 次要文字 */
    --indigo:#213A52;       /* 藍 accent */
    --shu:#D23B2C;          /* 朱色 批改紅 */
    --shu-deep:#B22E22;
    --shu-soft:#F6E1DC;     /* 正解底 */
    --gold:#C0872B;         /* 山吹金 */
    --gold-deep:#9C6A17;
    --gold-soft:#FBF3E0;
    --line:#DAD1C0;         /* 紙上細線 */
    --wrong-bg:#EFE3E1;
    --shadow:0 1px 2px rgba(34,48,63,.06),0 8px 24px rgba(34,48,63,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans TC",sans-serif;
    color:var(--ink);
    background:var(--paper);
    background-image:repeating-linear-gradient(to bottom,transparent 0 37px,rgba(33,58,82,.035) 37px 38px);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:clamp(14px,3vw,34px);
    display:flex;justify-content:center;
  }
  .jp{font-family:"Shippori Mincho",serif;font-weight:600}
  ruby rt{font-family:"Shippori Mincho",serif;font-weight:400}
  .wrap{width:100%;max-width:660px}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;padding-bottom:14px;margin-bottom:22px;
    border-bottom:2px solid var(--indigo);
    position:relative;
  }
  header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--indigo);opacity:.4}
  .title-block h1{
    font-family:"Shippori Mincho",serif;font-weight:800;
    font-size:clamp(1.55rem,5.5vw,2.15rem);letter-spacing:.06em;color:var(--indigo);
    line-height:1.15;
  }
  .title-block .sub{
    font-family:"Noto Serif TC",serif;font-size:.82rem;color:var(--ink-soft);
    letter-spacing:.14em;margin-top:5px;
  }
  .seal{
    flex:none;width:46px;height:46px;background:var(--shu);color:#fff;
    border-radius:8px;display:grid;place-items:center;transform:rotate(-4deg);
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.5rem;
    box-shadow:0 3px 8px rgba(178,46,34,.3);border:1.5px solid var(--shu-deep);
    margin-top:3px;
  }

  /* ---------- panels ---------- */
  .panel{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:clamp(20px,4vw,32px);
  }
  .eyebrow{
    font-family:"Noto Serif TC",serif;font-size:.72rem;font-weight:700;
    letter-spacing:.28em;color:var(--shu);text-transform:uppercase;margin-bottom:6px;
  }
  h2.step{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.28rem;color:var(--indigo);margin-bottom:4px}
  .hint{color:var(--ink-soft);font-size:.86rem;margin-bottom:18px}
  .field{margin-bottom:24px}
  .field-label{font-weight:700;font-size:.95rem;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .field-label .n{
    font-family:"Shippori Mincho",serif;color:var(--shu);font-weight:700;
    border:1.5px solid var(--shu);border-radius:50%;width:22px;height:22px;
    display:grid;place-items:center;font-size:.8rem;flex:none;
  }

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:"Noto Sans TC",sans-serif;font-size:.82rem;font-weight:500;
    padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
    background:transparent;color:var(--ink-soft);cursor:pointer;transition:all .15s;
    user-select:none;
  }
  .chip:hover{border-color:var(--indigo);color:var(--ink)}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .chip.all{border-style:dashed}
  .chip.all.on{background:var(--shu);border-color:var(--shu)}

  .opts-row{display:flex;flex-wrap:wrap;gap:8px}
  .seg{
    font-size:.88rem;font-weight:500;padding:11px 16px;border-radius:10px;
    border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    cursor:pointer;transition:all .15s;flex:1;min-width:calc(50% - 4px);text-align:center;
  }
  .seg:hover{border-color:var(--indigo);color:var(--ink)}
  .seg.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .seg small{display:block;font-size:.72rem;opacity:.75;margin-top:2px;font-weight:400}

  .count-row{display:flex;gap:8px}
  .count-btn{
    flex:1;font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.05rem;
    padding:10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;
    color:var(--ink-soft);cursor:pointer;transition:all .15s;
  }
  .count-btn:hover{border-color:var(--indigo);color:var(--ink)}
  .count-btn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  .btn-primary{
    width:100%;font-family:"Noto Serif TC",serif;font-weight:700;font-size:1.05rem;
    letter-spacing:.1em;padding:15px;border:none;border-radius:11px;cursor:pointer;
    background:var(--shu);color:#fff;transition:all .15s;
    box-shadow:0 4px 14px rgba(178,46,34,.28);
  }
  .btn-primary:hover{background:var(--shu-deep);transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed;transform:none}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .qcount{font-family:"Noto Serif TC",serif;font-size:.8rem;color:var(--ink-soft);letter-spacing:.1em}
  .qcount b{font-family:"Shippori Mincho",serif;color:var(--indigo);font-size:1.05rem}
  .score-tag{font-family:"Noto Serif TC",serif;font-size:.8rem;color:var(--ink-soft);display:flex;gap:12px}
  .score-tag .ok{color:var(--shu);font-weight:700}
  .score-tag .ng{color:var(--ink-soft)}
  .pips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:22px}
  .pip{width:100%;max-width:22px;height:5px;border-radius:3px;background:var(--line);flex:1;transition:background .3s}
  .pip.done{background:var(--indigo)}
  .pip.cur{background:var(--shu)}

  .qcard{
    position:relative;background:var(--paper-2);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:clamp(22px,5vw,40px) clamp(20px,5vw,36px);
    padding-left:clamp(28px,6vw,44px);text-align:center;overflow:hidden;
  }
  .qcard::before{content:"";position:absolute;left:14px;top:14px;bottom:14px;width:2px;background:var(--shu);opacity:.5;border-radius:2px}
  .qno{font-family:"Shippori Mincho",serif;font-size:.8rem;color:var(--shu);letter-spacing:.2em;margin-bottom:18px}
  .prompt-jp{font-family:"Shippori Mincho",serif;font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);color:var(--ink);line-height:1.25;letter-spacing:.02em}
  .prompt-jp ruby rt{font-size:.32em;color:var(--ink-soft);font-weight:400;letter-spacing:.04em}
  .prompt-cn{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(1.9rem,9vw,2.9rem);color:var(--ink);line-height:1.3}
  .prompt-tag{display:inline-block;font-size:.74rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:20px;letter-spacing:.14em;font-family:"Noto Serif TC",serif}
  .ask{margin-top:20px;font-size:.9rem;color:var(--ink-soft);letter-spacing:.05em}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  @media(max-width:460px){.options{grid-template-columns:1fr}}
  .option{
    position:relative;background:var(--paper-2);border:1.5px solid var(--line);
    border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s,transform .08s;
    min-height:60px;font-size:1.02rem;color:var(--ink);overflow:hidden;
  }
  .option:hover:not(.locked){border-color:var(--indigo);transform:translateY(-1px)}
  .option:focus-visible{outline:3px solid rgba(33,58,82,.35);outline-offset:2px}
  .option .key{
    flex:none;width:26px;height:26px;border-radius:7px;background:var(--paper);
    border:1.5px solid var(--line);display:grid;place-items:center;
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:.85rem;color:var(--ink-soft);
    transition:all .15s;
  }
  .option .txt{font-size:1.05rem;line-height:1.35}
  .option .txt.jp{font-family:"Shippori Mincho",serif;font-weight:600;font-size:1.35rem}
  .option .txt.jp ruby rt{font-size:.34em;color:var(--ink-soft);font-weight:400}
  .option.locked{cursor:default}
  .option.correct{background:var(--shu-soft);border-color:var(--shu)}
  .option.correct .key{background:var(--shu);border-color:var(--shu);color:#fff}
  .option.wrong{background:var(--wrong-bg);border-color:var(--shu);opacity:.92}
  .option.dim{opacity:.5}

  .mark-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  .mark-svg path{fill:none;stroke:var(--shu);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:100;stroke-dashoffset:100}
  .mark-svg.draw path{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1);stroke-dashoffset:0}

  .feedback{
    margin-top:20px;min-height:34px;display:flex;align-items:center;justify-content:center;gap:12px;
    font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.1rem;
    opacity:0;transition:opacity .25s;
  }
  .feedback.show{opacity:1}
  .feedback.right{color:var(--shu)}
  .feedback.miss{color:var(--indigo)}
  .feedback .ans{font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:.92rem;color:var(--ink-soft)}
  .feedback .ans .jp{color:var(--ink)}

  .next-row{margin-top:18px;display:flex;gap:10px}
  .btn-next{
    flex:1;font-family:"Noto Serif TC",serif;font-weight:700;font-size:1rem;letter-spacing:.08em;
    padding:14px;border:none;border-radius:11px;cursor:pointer;background:var(--indigo);color:#fff;
    transition:all .15s;box-shadow:0 4px 14px rgba(33,58,82,.22);
  }
  .btn-next:hover{background:#18293a;transform:translateY(-1px)}
  .btn-ghost{
    font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:.9rem;
    padding:14px 18px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;
    background:transparent;color:var(--ink-soft);transition:all .15s;
  }
  .btn-ghost:hover{border-color:var(--indigo);color:var(--ink)}

  /* ---------- result ---------- */
  .result{text-align:center}
  .result .eyebrow{text-align:center}
  .score-ring{position:relative;width:190px;height:150px;margin:8px auto 4px}
  .score-ring svg{position:absolute;inset:0;width:100%;height:100%}
  .score-ring svg path{fill:none;stroke:var(--shu);stroke-width:2.6;stroke-linecap:round;
    stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1) .2s}
  .score-ring.draw svg path{stroke-dashoffset:0}
  .score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-num .big{font-family:"Shippori Mincho",serif;font-weight:800;font-size:3.6rem;color:var(--ink);line-height:1}
  .score-num .tot{font-family:"Shippori Mincho",serif;font-size:1rem;color:var(--ink-soft);margin-top:2px}
  .verdict{font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.5rem;color:var(--indigo);margin:10px 0 4px}
  .verdict.manten{color:var(--shu)}
  .verdict-cn{color:var(--ink-soft);font-size:.9rem;margin-bottom:8px}
  .pct{font-family:"Noto Serif TC",serif;color:var(--ink-soft);font-size:.85rem;letter-spacing:.12em;margin-bottom:22px}

  .review{text-align:left;margin:8px 0 22px;border-top:1px solid var(--line);padding-top:18px}
  .review h3{font-family:"Noto Serif TC",serif;font-size:.95rem;color:var(--indigo);margin-bottom:12px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
  .review h3 .cnt{background:var(--shu);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 9px;font-family:"Noto Sans TC",sans-serif}
  .rev-item{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .rev-item:last-child{border-bottom:none}
  .rev-w{font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.15rem;color:var(--ink);flex:none}
  .rev-w ruby rt{font-size:.36em;color:var(--ink-soft);font-weight:400}
  .rev-m{color:var(--ink-soft);font-size:.9rem}
  .rev-theme{margin-left:auto;font-size:.72rem;color:var(--gold);font-family:"Noto Serif TC",serif;flex:none;padding-left:8px}

  .result-btns{display:flex;flex-direction:column;gap:10px}
  .allclear{color:var(--shu);font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.05rem;text-align:center;padding:14px 0 4px}

  footer{text-align:center;color:var(--ink-soft);font-size:.72rem;margin-top:22px;letter-spacing:.08em;font-family:"Noto Serif TC",serif}
  .hidden{display:none!important}

  /* ---------- 星號 star ---------- */
  .star-ic{fill:none;stroke:var(--ink-soft);stroke-width:1.8;stroke-linejoin:round;transition:fill .15s,stroke .15s}
  @keyframes starpop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* 設定頁：星號複習橫幅 */
  .star-banner{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;
    background:var(--gold-soft);border:1.5px solid #E6D2A4;border-radius:12px;padding:15px 17px;margin-bottom:24px}
  .star-banner.empty{background:var(--paper);border-color:var(--line);border-style:dashed}
  .sb-left{min-width:190px;flex:1}
  .sb-title{display:flex;align-items:center;gap:8px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:1rem;color:var(--indigo)}
  .sb-title .star-ic{width:20px;height:20px;fill:var(--gold);stroke:var(--gold);stroke-width:1.3}
  .star-banner.empty .sb-title .star-ic{fill:none;stroke:var(--ink-soft)}
  .sb-count{background:var(--gold);color:#fff;border-radius:999px;font-family:"Noto Sans TC",sans-serif;font-size:.75rem;font-weight:700;padding:1px 10px;min-width:26px;text-align:center}
  .star-banner.empty .sb-count{background:var(--ink-soft)}
  .sb-hint{font-size:.8rem;color:var(--ink-soft);margin-top:5px;line-height:1.5}
  .sb-btns{display:flex;gap:8px}
  .sb-go{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.88rem;padding:9px 16px;border:none;border-radius:9px;background:var(--gold);color:#fff;cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(192,135,43,.28)}
  .sb-go:hover:not(:disabled){background:var(--gold-deep);transform:translateY(-1px)}
  .sb-go:disabled{background:var(--line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
  .sb-view{font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:.85rem;padding:9px 14px;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--ink-soft);cursor:pointer;transition:all .15s}
  .sb-view:hover:not(:disabled){border-color:var(--gold);color:var(--ink)}
  .sb-view:disabled{opacity:.45;cursor:not-allowed}

  /* 測驗卡：標記藥丸 */
  .star-pill{position:absolute;top:12px;right:12px;z-index:4;display:inline-flex;align-items:center;gap:6px;
    padding:7px 12px 7px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink-soft);font-family:"Noto Sans TC",sans-serif;font-size:.76rem;font-weight:500;cursor:pointer;transition:all .15s}
  .star-pill:hover{border-color:var(--gold);color:var(--ink)}
  .star-pill .star-ic{width:16px;height:16px}
  .star-pill.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep);animation:starpop .3s}
  .star-pill.on .star-ic{fill:var(--gold);stroke:var(--gold)}

  /* 清單／複習列的星號按鈕 */
  .star-btn{flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);
    cursor:pointer;display:grid;place-items:center;transition:all .15s;padding:0;margin-left:8px;align-self:center}
  .star-btn:hover{border-color:var(--gold)}
  .star-btn .star-ic{width:19px;height:19px}
  .star-btn.on{background:var(--gold-soft);border-color:var(--gold);animation:starpop .3s}
  .star-btn.on .star-ic{fill:var(--gold);stroke:var(--gold)}

  /* 星號清單畫面 */
  .star-list{margin-top:8px}
  .star-row{display:flex;align-items:baseline;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line)}
  .star-row:last-child{border-bottom:none}
  .star-empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:30px 0;font-family:"Noto Serif TC",serif}
  .star-remove{margin-left:8px;flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;font-size:.82rem;transition:all .15s;align-self:center}
  .star-remove:hover{border-color:var(--shu);color:var(--shu);background:var(--wrong-bg)}

  @media(prefers-reduced-motion:reduce){.star-btn.on,.star-pill.on{animation:none!important}}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
    .mark-svg path,.score-ring svg path{stroke-dashoffset:0!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>日本語 単語帳</h1>
      <div class="sub">570 語 綜合複習測驗 ・ 20 主題</div>
    </div>
    <div class="seal jp">習</div>
  </header>

  <!-- START -->
  <section id="startScreen" class="panel">
    <div class="eyebrow">Settings ・ 設定</div>
    <h2 class="step">開始練習</h2>
    <p class="hint">選擇主題、出題方式與題數，按下開始即可。</p>

    <div class="star-banner empty" id="starBanner">
      <div class="sb-left">
        <div class="sb-title">
          <svg viewBox="0 0 24 24" class="star-ic" aria-hidden="true"><path d="M12 2.6 L14.85 8.4 L21.2 9.3 L16.6 13.75 L17.7 20.1 L12 17.1 L6.3 20.1 L7.4 13.75 L2.8 9.3 L9.15 8.4 Z"/></svg>
          星號複習 <span class="sb-count" id="sbCount">0</span>
        </div>
        <div class="sb-hint" id="sbHint">在測驗中點「標記複習」，不熟的單字會收藏到這裡。</div>
      </div>
      <div class="sb-btns">
        <button class="sb-go" id="starReviewBtn" disabled>開始複習</button>
        <button class="sb-view" id="starViewBtn" disabled>查看清單</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label"><span class="n">1</span>出題方式</div>
      <div class="opts-row" id="modeRow">
        <button class="seg on" data-mode="j2c">看日文選中文<small>日 → 中意思</small></button>
        <button class="seg" data-mode="c2j">看中文選日文<small>中 → 日單字</small></button>
        <button class="seg" data-mode="read">看漢字選讀音<small>漢字 → 假名</small></button>
      </div>
    </div>

    <div class="field">
      <div class="field-label"><span class="n">2</span>主題範圍</div>
      <div class="chips" id="themeChips"></div>
    </div>

    <div class="field">
      <div class="field-label"><span class="n">3</span>題數</div>
      <div class="count-row" id="countRow">
        <button class="count-btn on" data-count="10">10</button>
        <button class="count-btn" data-count="20">20</button>
        <button class="count-btn" data-count="30">30</button>
        <button class="count-btn" data-count="0">全部</button>
      </div>
    </div>

    <button class="btn-primary" id="startBtn">開始測驗</button>
  </section>

  <!-- QUIZ -->
  <section id="quizScreen" class="hidden">
    <div class="quiz-top">

/* ============ 星號 star ============ */
let starred=new Set();
let starScreenOpen=false;
const STAR_KEY="jp_vocab_stars_v1";
function loadStars(){try{const s=localStorage.getItem(STAR_KEY);if(s)starred=new Set(JSON.parse(s));}catch(e){}}
function saveStars(){try{localStorage.setItem(STAR_KEY,JSON.stringify([...starred]));}catch(e){}}
function isStarred(k){return starred.has(k);}
function toggleStar(k){if(starred.has(k))starred.delete(k);else starred.add(k);saveStars();updateStarUI();}
const STAR_SVG='<svg viewBox="0 0 24 24" class="star-ic" aria-hidden="true"><path d="M12 2.6 L14.85 8.4 L21.2 9.3 L16.6 13.75 L17.7 20.1 L12 17.1 L6.3 20.1 L7.4 13.75 L2.8 9.3 L9.15 8.4 Z"/></svg>';
function makeStarBtn(k){
  const b=document.createElement("button");
  b.className="star-btn"+(isStarred(k)?" on":"");
  b.innerHTML=STAR_SVG;b.title="標記／取消不熟";
  b.setAttribute("aria-pressed",isStarred(k)?"true":"false");
  b.onclick=()=>{toggleStar(k);b.classList.toggle("on",isStarred(k));b.setAttribute("aria-pressed",isStarred(k)?"true":"false");};
  return b;
}
function setPill(k){
  const pill=document.getElementById("starPill");if(!pill)return;
  pill.dataset.k=k;const on=isStarred(k);
  pill.classList.toggle("on",on);
  pill.setAttribute("aria-pressed",on?"true":"false");
  pill.querySelector(".lbl").textContent=on?"已標記":"標記複習";
}
function updateStarUI(){
  const n=starred.size;
  const c=document.getElementById("sbCount");if(c)c.textContent=n;
  const banner=document.getElementById("starBanner");
  const go=document.getElementById("starReviewBtn"),view=document.getElementById("starViewBtn"),hint=document.getElementById("sbHint");
  if(banner)banner.classList.toggle("empty",n===0);
  if(go)go.disabled=n===0;
  if(view)view.disabled=n===0;
  if(hint)hint.textContent=n===0?"在測驗中點「標記複習」，不熟的單字會收藏到這裡。":"隨時回來複習這 "+n+" 個不熟的單字。";
  const pill=document.getElementById("starPill");
  if(pill&&pill.dataset.k)setPill(pill.dataset.k);
  if(starScreenOpen)renderStarList();
}
function renderStarList(){
  const list=document.getElementById("starList");if(!list)return;
  const items=[...starred].map(k=>VOCAB_BY_K[k]).filter(Boolean);
  const rev=document.getElementById("starListReviewBtn"),clr=document.getElementById("starClearBtn");
  if(!items.length){
    list.innerHTML='<div class="star-empty">目前沒有星號單字。<br>在測驗中點右上角的「標記複習」即可加入。</div>';
    if(rev)rev.disabled=true;if(clr)clr.disabled=true;return;
  }
  if(rev)rev.disabled=false;if(clr)clr.disabled=false;
  list.innerHTML="";
  items.forEach(e=>{
    const row=document.createElement("div");row.className="star-row";
    row.innerHTML=`<span class="rev-w jp">${ruby(e.k,e.r)}</span><span class="rev-m">${e.m}</span><span class="rev-theme">${THEMES[e.t]}</span>`;
    const rm=document.createElement("button");rm.className="star-remove";rm.innerHTML="✕";rm.title="從星號移除";
    rm.onclick=()=>{starred.delete(e.k);saveStars();updateStarUI();};
    row.appendChild(rm);list.appendChild(row);
  });
}

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a;};
const ruby=(k,r)=>`<ruby>${k}<rt>${r}</rt></ruby>`;
const KANJI_NUM=["零","一","二","三","四","五","六","七","八","九","十"];
function kanjiNum(n){if(n<=10)return KANJI_NUM[n];if(n<20)return "十"+(n%10?KANJI_NUM[n%10]:"");if(n<100){const t=n/10|0,o=n%10;return KANJI_NUM[t]+"十"+(o?KANJI_NUM[o]:"");}return String(n);}

function buildThemeChips(){
  const box=$("#themeChips");
  const all=document.createElement("button");
  all.className="chip all on";all.textContent="全部主題";all.dataset.all="1";
  all.onclick=()=>{

    state.themes=new Set(on?ALL_THEME_IDS.slice():[]);

/* ============ 出題 ============ */
function optionKey(entry,mode){
  if(mode==="j2c")return entry.m;
  if(mode==="read")return entry.r;
  return entry.k+"|"+entry.r;
}
function makeQuestion(correct,mode,pool){
  const key=optionKey(correct,mode);
  const same=shuffle(pool.filter(e=>e!==correct&&e.t===correct.t));
  const rest=shuffle(pool.filter(e=>e!==correct&&e.t!==correct.t));
  const picked=[],usedKeys=new Set([key]);
  for(const e of same.concat(rest)){
    const k=optionKey(e,mode);
    if(usedKeys.has(k))continue;
    usedKeys.add(k);picked.push(e);
    if(picked.length===3)break;
  }
  const opts=shuffle([correct,...picked]);
  return{correct,opts,mode};
}
function buildQuiz(entries){
  const pool=VOCAB;
  let list=shuffle(entries);
  if(state.count>0)list=list.slice(0,state.count);
  state.quiz=list.map(e=>makeQuestion(e,state.mode,pool));
  state.idx=0;state.ok=0;state.ng=0;state.wrong=[];
}
function startQuiz(entries){
  buildQuiz(entries);
  $("#startScreen").classList.add("hidden");
  $("#resultScreen").classList.add("hidden");
  $("#quizScreen").classList.remove("hidden");
  $("#qTot").textContent=state.quiz.length;
  buildPips();
  renderQuestion();
  window.scrollTo(0,0);
}
function buildPips(){
  const box=$("#pips");box.innerHTML="";
  state.quiz.forEach(()=>{const p=document.createElement("div");p.className="pip";box.appendChild(p);});
}
function updatePips(){
  $("#pips").querySelectorAll(".pip").forEach((p,i)=>{
    p.className="pip"+(i<state.idx?" done":i===state.idx?" cur":"");
  });
}

  const box=$("#options");box.innerHTML="";
  const keyLabels=["A","B","C","D"];
  q.opts.forEach((e,i)=>{
    const b=document.createElement("button");
    b.className="option";b.dataset.i=i;
    let inner;
    if(q.mode==="j2c")inner=`<span class="txt">${e.m}</span>`;
    else if(q.mode==="c2j")inner=`<span class="txt jp">${ruby(e.k,e.r)}</span>`;
    else inner=`<span class="txt jp">${e.r}</span>`;
    b.innerHTML=`<span class="key jp">${keyLabels[i]}</span>${inner}`;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });

  const fb=$("#feedback");fb.className="feedback";fb.innerHTML="";
  $("#nextRow").classList.add("hidden");
}

/* ============ 批改動畫 ============ */
function drawMaru(optEl){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 100 100");svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("class","mark-svg");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M66 16 C86 18 90 40 85 55 C80 76 56 88 42 84 C22 78 14 55 18 40 C22 20 44 12 64 16 C76 18 82 24 85 31");
  p.setAttribute("pathLength","100");p.setAttribute("vector-effect","non-scaling-stroke");
  svg.appendChild(p);optEl.appendChild(svg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>svg.classList.add("draw")));
}
function drawSlash(optEl){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 100 100");svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("class","mark-svg");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M22 24 C42 40 60 58 80 78");
  p.setAttribute("pathLength","100");p.setAttribute("vector-effect","non-scaling-stroke");
  svg.appendChild(p);optEl.appendChild(svg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>svg.classList.add("draw")));
}

/* ============ 作答 ============ */
function answer(i){
  if(state.answered)return;
  state.answered=true;
  const q=state.quiz[state.idx];
  const correctIdx=q.opts.indexOf(q.correct);
  const box=$("#options");
  const btns=[...box.children];
  btns.forEach(b=>b.classList.add("locked"));

  const isRight=i===correctIdx;
  const fb=$("#feedback");
  const ansHtml=`${ruby(q.correct.k,q.correct.r)}　${q.correct.m}`;

  if(isRight){
    state.ok++;
    btns[i].classList.add("correct");
    drawMaru(btns[i]);
    fb.className="feedback right show";
    fb.innerHTML=`正解！`;
  }else{
    state.ng++;
    state.wrong.push(q.correct);
    btns[i].classList.add("wrong");
    drawSlash(btns[i]);
    btns[correctIdx].classList.add("correct");
    drawMaru(btns[correctIdx]);
    btns.forEach((b,bi)=>{if(bi!==i&&bi!==correctIdx)b.classList.add("dim");});
    fb.className="feedback miss show";
    fb.innerHTML=`残念…　<span class="ans"><span class="jp">${ansHtml}</span></span>`;
  }
  $("#okCount").textContent=state.ok;
  $("#ngCount").textContent=state.ng;
  $("#nextBtn").textContent=(state.idx===state.quiz.length-1)?"看結果 →":"下一題 →";
  $("#nextRow").classList.remove("hidden");
}
function next(){
  if(state.idx<state.quiz.length-1){state.idx++;renderQuestion();window.scrollTo(0,0);}
  else showResult();
}
$("#nextBtn").onclick=next;
$("#quitBtn").onclick=showResult;

/* ============ 結果 ============ */
function showResult(){
  $("#quizScreen").classList.add("hidden");
  $("#resultScreen").classList.remove("hidden");
  const total=state.ok+state.ng;
  const pct=total?Math.round(state.ok/total*100):0;
  $("#finalScore").textContent=state.ok;
  $("#finalTot").textContent="/ "+total;
  $("#pctText").textContent="正解率 "+pct+"%　・　共 "+total+" 題";

  const v=$("#verdict"),vc=$("#verdictCn");
  let jp,cn,manten=false;
  if(pct===100){jp="満点！";cn="全部答對，完美！";manten=true;}
  else if(pct>=80){jp="お見事！";cn="非常好，繼續保持！";}
  else if(pct>=60){jp="いい調子！";cn="不錯，再複習錯的就更穩了。";}
  else if(pct>=40){jp="もう一歩！";cn="還差一點，多練幾次會進步。";}
  else{jp="頑張ろう！";cn="別氣餒，複習後再挑戰一次吧。";}
  v.textContent=jp;v.className="verdict"+(manten?" manten":"");
  vc.textContent=cn;

  const ring=$("#scoreRing");ring.classList.remove("draw");
  requestAnimationFrame(()=>requestAnimationFrame(()=>ring.classList.add("draw")));

  const rb=$("#reviewBlock"),ac=$("#allClear"),rw=$("#reviewWrongBtn");
  const wrong=dedupeWrong(state.wrong);
  if(wrong.length){
    rb.classList.remove("hidden");ac.classList.add("hidden");rw.classList.remove("hidden");
    $("#reviewCnt").textContent=wrong.length;
    const list=$("#reviewList");list.innerHTML="";
    wrong.forEach(e=>{
      const row=document.createElement("div");row.className="rev-item";
      row.innerHTML=`<span class="rev-w jp">${ruby(e.k,e.r)}</span><span class="rev-m">${e.m}</span><span class="rev-theme">${THEMES[e.t]}</span>`;
      row.appendChild(makeStarBtn(e.k));
      list.appendChild(row);
    });
  }else{
    rb.classList.add("hidden");ac.classList.remove("hidden");rw.classList.add("hidden");
  }
  window.scrollTo(0,0);
}
function dedupeWrong(arr){const seen=new Set(),out=[];for(const e of arr){if(seen.has(e.k))continue;seen.add(e.k);out.push(e);}return out;}

/* ============ 結果按鈕 ============ */
$("#retryBtn").onclick=()=>{
  const entries=VOCAB.filter(e=>state.themes.has(e.t));
  startQuiz(entries);
};
$("#reviewWrongBtn").onclick=()=>{
  const wrong=dedupeWrong(state.wrong);
  const prev=state.count;state.count=0;   // 全部錯題
  startQuiz(wrong);
  state.count=prev;
};
$("#restartBtn").onclick=()=>{
  $("#resultScreen").classList.add("hidden");
  $("#startScreen").classList.remove("hidden");
  window.scrollTo(0,0);
};

/* ============ 開始 ============ */
$("#startBtn").onclick=()=>{
  const entries=VOCAB.filter(e=>state.themes.has(e.t));
  if(entries.length<4){alert("單字太少，請多選幾個主題。");return;}
  startQuiz(entries);
};

/* ============ 星號畫面串接 ============ */
function openStarScreen(){
  starScreenOpen=true;
  $("#startScreen").classList.add("hidden");
  $("#resultScreen").classList.add("hidden");
  $("#starScreen").classList.remove("hidden");
  renderStarList();window.scrollTo(0,0);
}
function closeStarScreen(){
  starScreenOpen=false;
  $("#starScreen").classList.add("hidden");
  $("#startScreen").classList.remove("hidden");
  window.scrollTo(0,0);
}
$("#starViewBtn").onclick=openStarScreen;
$("#starBackBtn").onclick=closeStarScreen;
$("#starReviewBtn").onclick=startStarredQuiz;
$("#starListReviewBtn").onclick=startStarredQuiz;
$("#starClearBtn").onclick=()=>{
  if(starred.size&&confirm("確定要清除全部 "+starred.size+" 個星號單字嗎？")){
    starred.clear();saveStars();updateStarUI();
  }
};

/* ============ 鍵盤 ============ */
document.addEventListener("keydown",e=>{
  if(!$("#quizScreen").classList.contains("hidden")){
    if(!state.answered){
      const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
      const k=e.key.toLowerCase();
      if(k in map){const btns=$("#options").children;if(map[k]<btns.length){answer(map[k]);e.preventDefault();}}
    }else if(e.key==="Enter"||e.key===" "){next();e.preventDefault();}
  }else if(!$("#startScreen").classList.contains("hidden")&&e.key==="Enter"){
    if(!$("#startBtn").disabled)$("#startBtn").click();
  }
});

/* ============ 初始化 ============ */
buildThemeChips();
loadStars();
updateStarUI();
validate();
</script>
</body>
</html>
